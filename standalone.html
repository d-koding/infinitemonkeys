<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>infinitemonkeys.com</title>
    <style>
      :root {
        --paper: #ffffff;
        --ink: #171717;
        --muted: #666666;
        --rule: #dddddd;
        --rule-strong: #bcbcbc;
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--paper);
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: "Courier New", Courier, monospace;
      }

      .page {
        width: min(860px, calc(100% - 2rem));
        margin: 0 auto;
        padding: 2rem 0 4rem;
      }

      .masthead {
        padding: 0 0 1.5rem;
        border-bottom: 1px solid var(--rule-strong);
        text-align: center;
      }

      .site-title,
      .status-message {
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .site-title {
        margin: 0;
        font-size: clamp(1.4rem, 3vw, 2rem);
      }

      .story-sheet {
        padding-top: 1rem;
      }

      .story-text,
      .sentence-input {
        font: inherit;
        font-size: clamp(1.05rem, 2vw, 1.4rem);
        line-height: 1.9;
        letter-spacing: 0.01em;
      }

      .story-text {
        min-height: 10rem;
        padding: 1rem 0 0.35rem;
        white-space: pre-wrap;
        word-break: break-word;
        animation: settle 180ms ease-out;
      }

      .entry-form {
        margin: 0;
      }

      .typing-line {
        padding: 0 0 0.35rem;
      }

      .input-wrap {
        position: relative;
        min-height: 2.2rem;
        display: flex;
        align-items: center;
      }

      .sentence-input {
        width: 100%;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--ink);
        outline: none;
      }

      .sentence-input::placeholder {
        color: #b3b3b3;
      }

      .sentence-input:disabled {
        color: var(--muted);
        cursor: not-allowed;
      }

      .status-message {
        margin: 0;
        padding: 0.55rem 0 0;
        color: var(--muted);
        font-size: 0.72rem;
        border-top: 1px solid var(--rule);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes settle {
        from {
          opacity: 0;
          transform: translateY(4px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 640px) {
        .page {
          width: min(100%, calc(100% - 1.25rem));
          padding-top: 1.25rem;
        }

        .story-text,
        .sentence-input {
          font-size: 1rem;
          line-height: 1.75;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="site-title">infinitemonkeys.com</p>
      </header>

      <section class="story-sheet" aria-label="Story">
        <div id="story-text" class="story-text"></div>

        <form id="story-form" class="entry-form" novalidate>
          <label class="sr-only" for="sentence-input">Write the next sentence</label>
          <div class="typing-line">
            <div class="input-wrap">
              <input
                id="sentence-input"
                name="sentence"
                class="sentence-input"
                type="text"
                maxlength="240"
                autocomplete="off"
                spellcheck="false"
                placeholder=""
                aria-describedby="status-message"
              />
            </div>
          </div>
          <p id="status-message" class="status-message" aria-live="polite">
            Press Enter to add your line.
          </p>
        </form>
      </section>
    </main>

    <script>
      const STORY_KEY = "infinite-monkeys-story";
      const CONTRIBUTION_KEY = "infinite-monkeys-has-contributed";

      const storyForm = document.getElementById("story-form");
      const sentenceInput = document.getElementById("sentence-input");
      const storyText = document.getElementById("story-text");
      const statusMessage = document.getElementById("status-message");

      const seedStory = [];

      function loadStory() {
        const saved = localStorage.getItem(STORY_KEY);

        if (!saved) {
          return seedStory;
        }

        try {
          const parsed = JSON.parse(saved);
          return Array.isArray(parsed) && parsed.every((item) => typeof item === "string")
            ? parsed
            : seedStory;
        } catch {
          return seedStory;
        }
      }

      let story = loadStory();

      function hasContributed() {
        return localStorage.getItem(CONTRIBUTION_KEY) === "true";
      }

      function persistStory() {
        localStorage.setItem(STORY_KEY, JSON.stringify(story));
      }

      function normalizeSentence(text) {
        return text.trim().replace(/\s+/g, " ");
      }

      function isSingleSentence(text) {
        const matches = text.match(/[.!?]+/g) || [];
        return matches.length <= 1;
      }

      function renderStory() {
        storyText.textContent = story.join(" ");
      }

      function lockContribution(message) {
        sentenceInput.disabled = true;
        sentenceInput.value = "";
        sentenceInput.placeholder = "Your line is already in the story.";
        storyForm.classList.add("is-locked");
        statusMessage.textContent = message;
      }

      function focusInput() {
        if (!hasContributed()) {
          sentenceInput.focus();
        }
      }

      storyForm.addEventListener("submit", (event) => {
        event.preventDefault();

        if (hasContributed()) {
          lockContribution("You already used your one line on this device.");
          return;
        }

        const text = normalizeSentence(sentenceInput.value);

        if (!text) {
          statusMessage.textContent = "Type one sentence, then press Enter.";
          return;
        }

        if (!/[.!?]$/.test(text)) {
          statusMessage.textContent = "End your line with a period, question mark, or exclamation point.";
          return;
        }

        if (!isSingleSentence(text)) {
          statusMessage.textContent = "Only one sentence.";
          return;
        }

        story = [...story, text];
        persistStory();
        localStorage.setItem(CONTRIBUTION_KEY, "true");
        renderStory();
        lockContribution("Entered. Your line is permanent here, and this device is done.");
      });

      sentenceInput.addEventListener("input", () => {
        statusMessage.textContent = "Press Enter to add your line.";
      });

      renderStory();

      if (hasContributed()) {
        lockContribution("You already used your one line on this device.");
      } else {
        focusInput();
      }
    </script>
  </body>
</html>
